name: Generate and Deploy PMSL Ensembles

on:
  schedule:
    # Runs at 04:15Z and 16:15Z (after 00Z and 12Z IFS/AIGEFS cycles finish)
    - cron: '15 4,16 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6-hour GitHub Actions maximum limit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Geospatial & GRIB Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PMSL Processing Pipeline
        run: |
          python src/pmsl.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pmsl_output
          force_orphan: true
